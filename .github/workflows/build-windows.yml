name: Build spcplay.exe (Windows)

on:
  workflow_dispatch: {}
  push:
    branches:
      - develop

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          echo "Runner: $RUNNER_OS"
          cmd /c "ver"

      - name: Install Lazarus (includes FPC) via Chocolatey, fallback to winget
        shell: pwsh
        run: |
          try {
            Write-Host 'Attempting: choco install lazarus -y'
            choco install lazarus -y
            Write-Host 'choco lazarus finished'
          } catch {
            Write-Host 'choco lazarus failed, trying winget'
            try {
              winget install --accept-source-agreements --accept-package-agreements FreePascal.FreePascal -e
              Write-Host 'winget installed FreePascal'
            } catch {
              Write-Host 'winget failed or package not found'
            }
          }
          Write-Host 'Verifying fpc availability'
          Get-Command fpc -All | Format-List -Force
          & cmd /c where fpc || Write-Host 'where fpc returned non-zero'

      - name: Explore Lazarus installation directory
        shell: cmd
        run: |
          echo "=== Checking Lazarus directory structure ==="
          if exist C:\lazarus (
            echo Found Lazarus at C:\lazarus
            dir C:\lazarus
            echo.
            echo FPC bin directory:
            dir C:\lazarus\fpc
          ) else (
            echo Lazarus not found at C:\lazarus
            exit /b 1
          )

      - name: Build spcplay.exe with lazbuild
        shell: cmd
        run: |
          echo "=== Building with lazbuild ==="
          cd spcplay.exe
          "C:\lazarus\lazbuild.exe" --build-mode=Release spcplay.dpr -o..\spcplay.exe
          if exist ..\spcplay.exe (
            echo [OK] Build succeeded via lazbuild
            exit /b 0
          ) else (
            echo [ERROR] lazbuild failed
            exit /b 1
          )

      - name: Verify spcplay.exe exists
        shell: cmd
        run: |
          if exist spcplay.exe (
            echo [OK] spcplay.exe created successfully
            dir spcplay.exe
          ) else (
            echo [ERROR] spcplay.exe not found
            exit /b 1
          )

      - name: Upload spcplay.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: spcplay-exe
          path: spcplay.exe

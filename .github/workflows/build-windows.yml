name: Build spcplay.exe (Windows)

on:
  workflow_dispatch: {}
  push:
    branches:
      - develop

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          echo "Runner: $RUNNER_OS"
          cmd /c "ver"

      - name: Install Lazarus (includes FPC) via Chocolatey, fallback to winget
        shell: pwsh
        run: |
          try {
            Write-Host 'Attempting: choco install lazarus -y'
            choco install lazarus -y
            Write-Host 'choco lazarus finished'
          } catch {
            Write-Host 'choco lazarus failed, trying winget'
            try {
              winget install --accept-source-agreements --accept-package-agreements FreePascal.FreePascal -e
              Write-Host 'winget installed FreePascal'
            } catch {
              Write-Host 'winget failed or package not found'
            }
          }
          Write-Host 'Verifying fpc availability'
          Get-Command fpc -All | Format-List -Force
          & cmd /c where fpc || Write-Host 'where fpc returned non-zero'

      - name: Add FPC to PATH and verify
        shell: pwsh
        run: |
          $env:PATH = "C:\lazarus\fpc\3.2.2\bin\i386-win32;C:\lazarus\fpc\3.2.2\bin\x86_64-win64;$env:PATH"
          Write-Host "PATH includes FPC now"
          & cmd /c where fpc || Write-Host 'fpc not in PATH yet'
          & fpc -v

      - name: Build spcplay.exe (32-bit, fallback to 64-bit)
        shell: cmd
        run: |
          set PATH=C:\lazarus\fpc\3.2.2\bin\i386-win32;C:\lazarus\fpc\3.2.2\bin\x86_64-win64;%PATH%
          cd spcplay.exe
          echo "=== Attempting 32-bit build ==="
          fpc -Twin32 -Pi386 spcplay.dpr -o..\spcplay.exe
          if exist ..\spcplay.exe (
            echo [OK] 32-bit build succeeded
            exit /b 0
          )
          echo "=== 32-bit failed, trying 64-bit ==="
          fpc -Twin64 -Px86_64 spcplay.dpr -o..\spcplay.exe
          cd ..
          if not exist spcplay.exe (
            echo [ERROR] Both 32-bit and 64-bit builds failed
            exit /b 1
          )
          echo [OK] 64-bit build succeeded

      - name: Verify spcplay.exe exists
        shell: cmd
        run: |
          if exist spcplay.exe (
            echo [OK] spcplay.exe created successfully
            dir spcplay.exe
          ) else (
            echo [ERROR] spcplay.exe not found
            exit /b 1
          )

      - name: Upload spcplay.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: spcplay-exe
          path: spcplay.exe
